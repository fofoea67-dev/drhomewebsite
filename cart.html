<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>السلة والدفع · DR HOME</title>
<meta name="description" content="راجع سلتك وأكمل طلبك من دكتور هوم: توصيل وتركيب مجاني ودفع آمن.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="cart">
<div id="dh-top"></div>
<main>
  <div class="wrap">
    <nav class="crumbs" aria-label="مسار التصفح"><a href="index.html">الرئيسية</a><i data-i="chevL"></i><b>السلة والدفع</b></nav>
    <div class="cat-head" style="padding-bottom:0"><div><h1 class="h1">سلة التسوق</h1><p class="muted" id="cartN"></p></div></div>
    <div class="ck-steps" id="ckSteps"></div>
    <div id="ckWrap">
      <form class="checkout" id="ckForm">
        <div class="ck-main">
          <section class="panel" aria-labelledby="p1">
            <div class="panel-h"><h2 id="p1"><i>1</i>المنتجات</h2><a class="link" href="products.html">متابعة التسوق<i data-i="arrowL"></i></a></div>
            <div id="cartList"></div>
          </section>

          <section class="panel" aria-labelledby="p2">
            <div class="panel-h"><h2 id="p2"><i>2</i>معلومات التوصيل</h2></div>
            <div class="form">
              <div class="field"><label for="fn">الاسم الكامل</label><input class="input" id="fn" required autocomplete="name" placeholder="مثال: علي حسن"></div>
              <div class="field"><label for="ph">رقم الهاتف</label><input class="input" id="ph" type="tel" required autocomplete="tel" placeholder="07XX XXX XXXX" pattern="[0-9 +]{10,16}"></div>
              <div class="field"><label for="gov">المحافظة</label><div class="sel"><select class="input" id="gov"></select><i data-i="chevD"></i></div></div>
              <div class="field"><label for="area">المنطقة أو الحي</label><input class="input" id="area" required placeholder="مثال: المنصور"></div>
              <div class="field full"><label for="addr">العنوان التفصيلي</label><input class="input" id="addr" required autocomplete="street-address" placeholder="الشارع، رقم الدار، أقرب نقطة دالة"></div>
              <div class="field full"><label for="notes">ملاحظات للتوصيل (اختياري)</label><textarea class="input" id="notes" placeholder="مثال: الطابق الثالث، يوجد مصعد"></textarea></div>
            </div>
            <div class="opts">
              <label class="opt"><input type="radio" name="ship" value="std" checked><i data-i="truck"></i><div><b>توصيل عادي</b><span>خلال 48 ساعة داخل بغداد</span></div><em>مجاني</em></label>
              <label class="opt"><input type="radio" name="ship" value="express"><i data-i="bolt"></i><div><b>توصيل سريع</b><span>اليوم قبل 10 مساءً</span></div><em>25,000 د.ع</em></label>
            </div>
          </section>

          <section class="panel" aria-labelledby="p3">
            <div class="panel-h"><h2 id="p3"><i>3</i>طريقة الدفع</h2><span class="secure"><i data-i="lock"></i>دفع آمن ومشفّر</span></div>
            <div class="opts" id="payOpts"></div>
          </section>
        </div>

        <aside class="summary" aria-labelledby="sumT">
          <h2 id="sumT">ملخص الطلب</h2>
          <div id="sum"></div>
          <div class="promo"><label class="sr-only" for="promo">كود الخصم</label><input class="input" id="promo" placeholder="كود الخصم، مثل DRHOME10" autocomplete="off"><button class="btn btn-outline btn-sm" type="button" id="promoBtn">تطبيق</button></div>
          <p class="promo-msg" id="promoMsg" hidden></p>
          <button class="btn btn-primary btn-block" type="submit" id="placeOrder"><i data-i="lock"></i>إتمام الطلب</button>
          <p class="secure"><i data-i="shield"></i>بإتمام الطلب أنت توافق على الشروط والأحكام</p>
          <div class="help-card"><span class="feat-ic"><i data-i="headset"></i></span><div><b>تحتاج مساعدة؟</b><br><span class="muted">اتصل بنا على 6600 يومياً حتى 11 مساءً</span></div></div>
        </aside>
      </form>
    </div>
  </div>
</main>
<div id="dh-footer"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
