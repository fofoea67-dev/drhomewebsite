<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F172A">
<title>لوحة تحكم DR HOME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #A50034; --red-d: #820029; --red-50: #FFF1F4;
    --side: #0F172A; --side2: #1E293B; --side-t: #94A3B8;
    --bg: #F1F5F9; --card: #fff; --line: #E2E8F0; --line2: #CBD5E1;
    --t: #0F172A; --t2: #334155; --mut: #64748B;
    --green: #059669; --green-d: #047857; --green-50: #ECFDF5;
    --amber: #B45309; --amber-50: #FFFBEB;
    --rose: #E11D48; --rose-50: #FFF1F2; --blue: #2563EB;
    --r: 14px; --sh: 0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Tajawal', system-ui, sans-serif; background: var(--bg); color: var(--t); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body.lock { overflow: hidden; }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, select, textarea { font: inherit; color: inherit; }
  code { background: #F1F5F9; border-radius: 6px; padding: 1px 6px; font-size: .92em; direction: ltr; unicode-bidi: embed; }
  .ic { width: 18px; height: 18px; flex: none; }
  .muted { color: var(--mut); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  [hidden] { display: none !important; }

  /* ---------- Sidebar ---------- */
  #sidebar { position: fixed; top: 0; bottom: 0; right: 0; width: 264px; background: var(--side); color: #E2E8F0; display: flex; flex-direction: column; z-index: 40; transition: transform .25s ease; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 20px 18px; border-bottom: 1px solid var(--side2); }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: var(--red); display: grid; place-items: center; font-weight: 900; font-size: 16px; color: #fff; }
  .brand b { display: block; font-weight: 900; font-size: 16px; line-height: 1.2; }
  .brand small { color: var(--side-t); font-size: 12px; font-weight: 700; }
  .menu { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
  .menu a { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #CBD5E1; text-decoration: none; font-weight: 700; font-size: 14.5px; }
  .menu a:hover { background: var(--side2); color: #fff; }
  .menu a.active { background: var(--red); color: #fff; box-shadow: 0 8px 20px -6px rgba(165,0,52,.6); }
  .menu .nav-count { margin-inline-start: auto; font-size: 11.5px; background: rgba(255,255,255,.12); border-radius: 99px; padding: 1px 8px; }
  .menu .sep { height: 1px; background: var(--side2); margin: 8px 6px; }
  .side-foot { padding: 14px; border-top: 1px solid var(--side2); display: grid; gap: 10px; }
  .side-status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #CBD5E1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #94A3B8; }
  .dot.green { background: #34D399; } .dot.amber { background: #FBBF24; }
  #side-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 35; display: none; }

  /* ---------- Main + topbar ---------- */
  #main { margin-right: 264px; min-height: 100vh; display: flex; flex-direction: column; }
  #topbar { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 12px 28px; display: flex; align-items: center; gap: 14px; }
  .titles { min-width: 0; flex: 1; }
  .titles h1 { margin: 0; font-size: 19px; font-weight: 900; line-height: 1.3; }
  .titles p { margin: 0; font-size: 12.5px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .menu-btn { display: none !important; }
  #notice:empty { display: none; }
  #notice, #view { width: 100%; max-width: 1400px; margin: 0 auto; }
  #notice { padding: 18px 28px 0; }
  #view { padding: 22px 28px 70px; }

  /* ---------- Generic UI ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--sh); margin-bottom: 16px; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .card-h h3 { margin: 0; font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
  .card.dim { opacity: .75; }
  .stack { display: grid; gap: 12px; }
  .g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row-btns.center { justify-content: center; }
  .acts { display: flex; gap: 4px; flex-wrap: wrap; }
  .view-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .view-actions p { margin: 0; font-size: 13.5px; }
  .empty { text-align: center; color: var(--mut); padding: 30px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 11px; padding: 10px 16px; font-weight: 800; font-size: 14px; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s, opacity .15s; line-height: 1.2; }
  .btn-primary { background: var(--red); color: #fff; } .btn-primary:hover { background: var(--red-d); }
  .btn-green { background: var(--green); color: #fff; } .btn-green:hover { background: var(--green-d); }
  .btn-dark { background: var(--side); color: #fff; } .btn-dark:hover { background: #1E293B; }
  .btn-ghost { background: #fff; border-color: var(--line2); color: var(--t2); } .btn-ghost:hover { background: #F8FAFC; border-color: #94A3B8; }
  .btn-danger { background: var(--rose); color: #fff; } .btn-danger:hover { background: #BE123C; }
  .btn-danger-ghost { background: #fff; border-color: #FECDD3; color: var(--rose); } .btn-danger-ghost:hover { background: var(--rose-50); }
  .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
  .w100 { width: 100%; }
  .ibtn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--t2); padding: 0; }
  .ibtn:hover { background: #F1F5F9; }
  .ibtn.danger { color: var(--rose); } .ibtn.danger:hover { background: var(--rose-50); border-color: #FECDD3; }
  .ibtn .ic { width: 17px; height: 17px; }

  #publish-btn .cnt { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: #fff; color: var(--green); font-size: 12px; font-weight: 900; display: none; place-items: center; }
  #publish-btn.has .cnt { display: inline-grid; }
  #publish-btn:not(.has) { opacity: .6; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 800; background: #F1F5F9; color: var(--t2); white-space: nowrap; text-decoration: none; }
  .pill.ok { background: var(--green-50); color: var(--green); }
  .pill.bad { background: var(--rose-50); color: var(--rose); }
  .pill.wait { background: var(--amber-50); color: var(--amber); }
  .pill .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill .ic { width: 14px; height: 14px; }

  .alert { border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600; line-height: 1.6; }
  .alert.warn { background: var(--amber-50); color: #92400E; }
  .alert.err { background: var(--rose-50); color: #9F1239; }
  .alert.info { background: #EFF6FF; color: #1E40AF; }
  .alert.ok { background: var(--green-50); color: #065F46; }
  .alert ul { margin: 6px 0 0; padding-inline-start: 18px; }

  /* ---------- Form fields ---------- */
  .fld { display: block; min-width: 0; }
  .fl { display: block; font-size: 12.5px; font-weight: 800; color: var(--t2); margin-bottom: 5px; }
  .fh { display: block; font-size: 11.5px; color: var(--mut); margin-top: 4px; }
  .in { width: 100%; border: 1px solid var(--line2); background: #F8FAFC; border-radius: 10px; padding: 9px 12px; font-size: 14px; outline: none; transition: border-color .15s, background .15s, box-shadow .15s; }
  .in:focus { background: #fff; border-color: var(--red); box-shadow: 0 0 0 3px rgba(165,0,52,.12); }
  textarea.in { resize: vertical; min-height: 44px; line-height: 1.6; }
  select.in { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
  .num.strong { font-weight: 900; font-size: 16px; border-color: rgba(165,0,52,.35); background: #fff; }
  .chk { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .chk input { width: 17px; height: 17px; accent-color: var(--red); }

  .sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-weight: 700; font-size: 13px; position: relative; }
  .sw input { position: absolute; opacity: 0; pointer-events: none; }
  .sw-t { width: 38px; height: 22px; border-radius: 99px; background: #CBD5E1; position: relative; transition: background .2s; flex: none; }
  .sw-t::after { content: ''; position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
  .sw input:checked + .sw-t { background: var(--green); }
  .sw.offer input:checked + .sw-t { background: var(--red); }
  .sw input:checked + .sw-t::after { transform: translateX(-16px); }
  .sw input:focus-visible + .sw-t { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ---------- Images ---------- */
  .imgfld { display: flex; gap: 14px; align-items: flex-start; }
  .imgprev { width: 120px; height: 120px; border: 1px solid var(--line); border-radius: 12px; background: #F8FAFC; display: grid; place-items: center; overflow: hidden; flex: none; padding: 6px; }
  .imgprev img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .imgfld-category .imgprev, .imgfld-logo .imgprev { width: 96px; height: 96px; }
  .imgfld-category .imgprev { border-radius: 50%; padding: 0; }
  .imgfld-category .imgprev img { width: 100%; height: 100%; object-fit: cover; }
  .imgctl { flex: 1; display: grid; gap: 8px; min-width: 0; justify-items: start; }
  .imgctl .in { width: 100%; }
  .ph { display: grid; place-items: center; gap: 2px; color: #94A3B8; font-size: 11px; font-weight: 700; text-align: center; }
  .ph .ic { width: 24px; height: 24px; }
  img.broken { opacity: .2; }
  .pending-note { font-size: 12px; font-weight: 800; color: var(--amber); background: var(--amber-50); border-radius: 8px; padding: 5px 10px; }
  .link-danger { background: none; border: 0; padding: 0; color: var(--rose); font-size: 12.5px; font-weight: 800; }

  /* ---------- Dashboard ---------- */
  .stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--sh); display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: right; transition: border-color .15s, transform .15s; }
  .stat:hover { border-color: var(--line2); transform: translateY(-1px); }
  .stat .si { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #F1F5F9; color: var(--t2); }
  .stat b { font-size: 26px; font-weight: 900; line-height: 1; }
  .stat span.l { font-size: 13px; color: var(--mut); font-weight: 700; }
  .stat.green .si { background: var(--green-50); color: var(--green); }
  .stat.red .si { background: var(--red-50); color: var(--red); }
  .stat.gray .si { background: #F1F5F9; color: var(--mut); }
  .cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
  .cols > .card { margin-bottom: 0; }
  .cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: linear-gradient(135deg, #0F172A, #3B0418); color: #fff; border-radius: var(--r); padding: 20px 22px; margin-bottom: 16px; }
  .cta h3 { margin: 0 0 4px; font-size: 17px; font-weight: 900; display: flex; gap: 8px; align-items: center; }
  .cta p { margin: 0; color: #CBD5E1; font-size: 13.5px; }
  .cta.bad { background: linear-gradient(135deg, #881337, #4C0519); }
  .issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .iss { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; background: #F8FAFC; font-size: 13.5px; }
  .iss .msg { flex: 1; min-width: 0; }
  .iss-err { background: var(--rose-50); } .iss-err .dot { background: var(--rose); }
  .iss-warn { background: var(--amber-50); } .iss-warn .dot { background: #F59E0B; }
  .empty-ok { display: flex; align-items: center; gap: 8px; color: var(--green); font-weight: 800; padding: 10px 0; }
  .commits { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .commits li a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 4px; border-bottom: 1px solid #F1F5F9; text-decoration: none; font-size: 13.5px; }
  .commits li a:hover { background: #F8FAFC; }
  .commits .cm { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commits .ct { color: var(--mut); font-size: 12px; white-space: nowrap; }
  .src-badge { display: inline-block; font-size: 10.5px; font-weight: 800; border-radius: 6px; padding: 1px 6px; margin-inline-start: 6px; background: #F1F5F9; color: var(--mut); }
  .src-badge.me { background: var(--red-50); color: var(--red); }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------- Products ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search { position: relative; flex: 1 1 260px; }
  .search .ic { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--mut); }
  .search .in { padding-right: 38px; }
  .toolbar select.in { width: auto; flex: 0 1 180px; }
  details.bulk summary { cursor: pointer; font-weight: 800; display: flex; align-items: center; gap: 8px; list-style: none; }
  details.bulk summary::-webkit-details-marker { display: none; }
  details.bulk summary .muted { font-weight: 600; font-size: 12.5px; }
  .bulk-body { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
  .bulk-body .in { width: auto; flex: 0 1 200px; }
  .list-head { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 10px; font-size: 13px; color: var(--mut); font-weight: 700; }
  .prow { display: grid; gap: 10px 16px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--sh);
    grid-template-columns: 72px minmax(0, 1fr) 300px 120px auto; grid-template-areas: "th in pr tg ac"; }
  .prow.mod { border-color: #FCD34D; box-shadow: inset -4px 0 0 #F59E0B, var(--sh); }
  .prow.flash { animation: flash 1.2s ease; }
  @keyframes flash { from { background: #FEF3C7; } to { background: #fff; } }
  .pthumb { grid-area: th; width: 72px; height: 72px; border-radius: 12px; border: 1px solid var(--line); background: #F8FAFC; padding: 4px; display: grid; place-items: center; overflow: hidden; }
  .pthumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .pthumb .ph span { display: none; }
  .pinfo { grid-area: in; min-width: 0; }
  .pname { background: none; border: 0; padding: 0; text-align: right; font-weight: 800; font-size: 14.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pname:hover { color: var(--red); }
  .pmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--mut); }
  .chip { background: #F1F5F9; border-radius: 999px; padding: 2px 9px; font-weight: 700; color: var(--t2); }
  .chip.bad { background: var(--rose-50); color: var(--rose); }
  .tag-mod { display: none; background: #FEF3C7; color: #92400E; border-radius: 999px; padding: 2px 9px; font-weight: 800; }
  .prow.mod .tag-mod { display: inline-block; }
  .pprice { grid-area: pr; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  .pf span { display: block; font-size: 11.5px; font-weight: 700; color: var(--mut); margin-bottom: 3px; }
  .pf .in { padding: 7px 10px; }
  .disc { grid-column: 1 / -1; font-size: 12px; font-weight: 700; min-height: 18px; }
  .disc .ok { color: var(--green); } .disc .warn { color: var(--amber); }
  .ptog { grid-area: tg; display: grid; gap: 10px; }
  .pacts { grid-area: ac; display: flex; gap: 4px; }

  /* ---------- Drawer ---------- */
  #drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(640px, 100%); background: #fff; z-index: 60; display: flex; flex-direction: column; transform: translateX(-102%); transition: transform .25s ease; box-shadow: 10px 0 40px rgba(15,23,42,.18); }
  #drawer.open { transform: none; }
  #drawer-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 55; display: none; }
  body.drawer-open #drawer-overlay { display: block; }
  .dr-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .dr-head h3 { margin: 2px 0 0; font-size: 16px; font-weight: 900; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dr-kicker { font-size: 12px; color: var(--red); font-weight: 800; display: flex; gap: 10px; align-items: center; }
  .dr-kicker a { color: var(--mut); font-weight: 700; text-decoration: none; display: inline-flex; gap: 4px; align-items: center; }
  .dr-kicker a .ic { width: 13px; height: 13px; }
  .dr-body { flex: 1; overflow-y: auto; padding: 4px 20px 24px; }
  .dsec { padding: 16px 0; border-bottom: 1px dashed var(--line); display: grid; gap: 12px; }
  .dsec:last-child { border-bottom: 0; }
  .dsec h4 { margin: 0; font-size: 14px; font-weight: 900; }
  .dr-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #F8FAFC; }
  .dr-note { font-size: 11.5px; color: var(--mut); flex-basis: 100%; }

  /* ---------- Categories / brands / banners ---------- */
  .cat-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: start; }
  .cat-side { display: grid; gap: 8px; justify-items: end; }
  .subs { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); display: grid; gap: 8px; justify-items: start; }
  .subs-h { font-size: 13px; font-weight: 900; color: var(--t2); }
  .sub-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, .9fr) auto; gap: 8px; align-items: center; width: 100%; }
  .brow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 170px) auto auto; gap: 12px; align-items: end; }
  .brow .full { grid-column: 1 / -1; }
  .brow.dup { border-color: #FDA4AF; }
  .banner-grid { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .bprev { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #0F172A; color: #fff; }
  .bprev img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .6; }
  .bprev-txt { position: absolute; inset: auto 0 0 0; padding: 14px; background: linear-gradient(transparent, rgba(0,0,0,.75)); display: grid; gap: 6px; justify-items: start; }
  .bprev .bb { background: var(--red); border-radius: 99px; font-size: 10.5px; font-weight: 800; padding: 2px 9px; }
  .bprev .bb:empty { display: none; }
  .bprev .bt { font-size: 15px; font-weight: 900; line-height: 1.35; }

  /* ---------- Connect ---------- */
  .cs { display: flex; gap: 14px; align-items: flex-start; }
  .cs > .ic { width: 28px; height: 28px; }
  .cs b { display: block; font-size: 16px; font-weight: 900; }
  .cs span { font-size: 13.5px; color: var(--t2); }
  .cs.ok > .ic { color: var(--green); } .cs.bad > .ic { color: var(--rose); } .cs.none > .ic { color: var(--amber); }
  ol.steps { margin: 0 0 16px; padding-inline-start: 22px; display: grid; gap: 10px; font-size: 14px; line-height: 1.7; }
  .token-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .token-row .in { flex: 1 1 280px; }

const fmt = (n) => Number(n || 0).toLocaleString('en-US');
const short = (s, n = 60) => { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; };
const toLatin = (s) => String(s == null ? '' : s).replace(/[٠-٩]/g, (d) => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, (d) => d.charCodeAt(0) - 1776);
const normAr = (s) => String(s || '').toLowerCase().replace(/[إأآا]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/[ً-ْـ]/g, '');
const slug = (s) => String(s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48);

const store = {

function arCount(n, one, two, few, many) {
  if (n === 1) return one;
  if (n === 2) return two;
  if (n >= 3 && n <= 10) return n + ' ' + few;
  return n + ' ' + many;
}
function ago(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'الآن';
  const m = Math.floor(s / 60); if (m < 60) return 'قبل ' + arCount(m, 'دقيقة', 'دقيقتين', 'دقائق', 'دقيقة');
  const h = Math.floor(m / 60); if (h < 24) return 'قبل ' + arCount(h, 'ساعة', 'ساعتين', 'ساعات', 'ساعة');
  const d = Math.floor(h / 24); if (d < 30) return 'قبل ' + arCount(d, 'يوم', 'يومين', 'أيام', 'يوماً');
  return new Date(iso).toLocaleDateString('ar-IQ');
}

/* ---------------- الأيقونات ---------------- */
const ICONS = {

  history: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const icon = (n) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------------- الحالة ---------------- */
const Cfg = Object.assign({}, DEFAULTS, safeJson(store.get(KEYS.cfg)) || {});
let Token = store.get(KEYS.token) || store.get('drhome_gh_token') || '';
if (Token && !store.get(KEYS.token)) store.set(KEYS.token, Token);

const S = {
  data: null, published: '{}', pubObj: {}, fileSha: null, loadError: null,

const VIEWS = {

function setPath(o, p, v) {
  const ks = p.split('.'); let a = o;
  for (let i = 0; i < ks.length - 1; i++) {
    if (a[ks[i]] == null || typeof a[ks[i]] !== 'object') a[ks[i]] = {};

  a[ks[ks.length - 1]] = v;
}
function normalize(d) {
  if (!d.storeInfo || typeof d.storeInfo !== 'object') d.storeInfo = {};
  ['banners', 'brands', 'categories', 'products', 'branches', 'faqs'].forEach((k) => { if (!Array.isArray(d[k])) d[k] = []; });

}

}

const isAbs = (v) => /^(data:|https?:|\/\/|blob:)/i.test(v);

}

/* =====================================================================
   GitHub
   ===================================================================== */
class GhError extends Error { constructor(status, message) { super(message); this.status = status; } }
class SoftError extends Error { constructor(name, message) { super(message); this.name = name; } }

async function gh(path, opts = {}) {
  const tok = opts.token !== undefined ? opts.token : Token;
  const headers = { Accept: opts.accept || 'application/vnd.github+json' };
  if (tok) headers.Authorization = 'Bearer ' + tok;
  let body;
  if (opts.body !== undefined) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(opts.body); }
  const res = await fetch(API + path, { method: opts.method || 'GET', headers, body, cache: 'no-store' });
  if (!res.ok) {
    let msg = '';
    try { msg = (await res.json()).message || ''; } catch (e) {}
    throw new GhError(res.status, msg);
  }
  if (res.status === 204) return null;
  return opts.text ? res.text() : res.json();
}

function ghErrorAr(e) {
  if (!e || e.status === undefined) return 'تعذّر الاتصال بـ GitHub — تأكد من الإنترنت وحاول مرة أخرى.';
  const m = String(e.message || '').toLowerCase();
  switch (e.status) {
    case 401: return 'مفتاح GitHub غير صحيح أو انتهت صلاحيته. أنشئ مفتاحاً جديداً من صفحة «الربط والنشر».';
    case 403: return m.includes('rate limit')
      ? 'تم تجاوز عدد الطلبات المسموح مؤقتاً. انتظر بضع دقائق ثم حاول مرة أخرى.'
      : 'المفتاح لا يملك صلاحية النشر. عند إنشائه اختر مستودع drhome، ومن Permissions اختر Contents ← Read and write.';
    case 404: return 'لم يتم العثور على المستودع، أو المفتاح لا يملك صلاحية عليه. تأكد من اختيار مستودع drhome في Repository access.';
    case 409: case 422: return 'حدث تعارض أثناء الحفظ (ربما عُدّل الموقع من مكان آخر في نفس اللحظة). حاول مرة أخرى.';
    default: return e.status >= 500 ? 'خوادم GitHub لا تستجيب حالياً، حاول بعد قليل.' : `خطأ من GitHub (${e.status}): ${e.message || ''}`;
  }
}

function b64ToText(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
async function gitBlobSha(text) {
  try {
    const body = new TextEncoder().encode(text);
    const head = new TextEncoder().encode('blob ' + body.length + '\0');
    const all = new Uint8Array(head.length + body.length); all.set(head); all.set(body, head.length);
    const h = await crypto.subtle.digest('SHA-1', all);
    return Array.from(new Uint8Array(h)).map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { return null; }
}

async function loadLive() {
  const p = `/repos/${Cfg.owner}/${Cfg.repo}/contents/content.json?ref=${encodeURIComponent(Cfg.branch)}`;
  let text = null, sha = null, firstErr = null;
  const viaApi = async (tok) => {
    const meta = await gh(p, { token: tok });
    sha = meta.sha;
    if (meta.encoding === 'base64' && meta.content) return b64ToText(meta.content);
    return gh(p, { token: tok, accept: 'application/vnd.github.raw+json', text: true });
  };
  try { text = await viaApi(Token); }
  catch (e) {
    firstErr = e;
    if (Token && e.status === 401) { try { text = await viaApi(''); } catch (e2) {} }
  }
  if (text == null && /^https?:$/.test(location.protocol)) {
    try { const r = await fetch('./content.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) text = await r.text(); } catch (e) {}
  }
  if (text == null) {
    try { const r = await fetch(rawUrl('content.json') + '?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) text = await r.text(); } catch (e) {}
  }
  if (text == null) throw firstErr || new Error('load');
  const data = safeJson(text);
  if (!data || typeof data !== 'object') throw new Error('json');
  normalize(data);
  S.data = data;
  setPublished(JSON.stringify(data));
  S.fileSha = sha || (await gitBlobSha(text));
}

/* ---------------- الصور ---------------- */
function readAsDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}
function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
async function processImage(file, kind) {
  if (file.size > 20 * 1024 * 1024) throw new Error('big');
  const max = { product: 1000, banner: 1600, category: 600, logo: 600 }[kind] || 1200;
  const src = await readAsDataURL(file);
  if (/^image\/(svg\+xml|gif)$/.test(file.type)) return src; // SVG و GIF كما هي
  const img = await loadImage(src);
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  if (scale === 1 && file.size <= 350 * 1024 && /^image\/(jpeg|png|webp)$/.test(file.type)) return src;
  const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  if (file.type === 'image/jpeg') {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.85);
  }
  ctx.drawImage(img, 0, 0, w, h); // نحافظ على الخلفية الشفافة
  const webp = c.toDataURL('image/webp', 0.86);
  return webp.startsWith('data:image/webp') ? webp : c.toDataURL('image/png');
}
function parseDataUrl(u) {
  const i = u.indexOf(','); const head = u.slice(5, i); const body = u.slice(i + 1);
  const mime = head.split(';')[0] || 'application/octet-stream';
  const b64 = /;base64/i.test(head) ? body : btoa(unescape(encodeURIComponent(decodeURIComponent(body))));
  return { mime, b64 };
}
const extFor = (m) => ({ 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'image/svg+xml': 'svg', 'image/avif': 'avif' }[m] || 'img');
function collectDataUrls(root) {
  const out = [];
  const visit = (holder, key, v, path) => {
    if (typeof v === 'string') { if (v.startsWith('data:image/')) out.push({ holder, key, dataUrl: v, name: imgName(path, holder) }); }
    else if (v && typeof v === 'object') walk(v, path);
  };
  const walk = (node, path) => {
    if (Array.isArray(node)) node.forEach((v, i) => visit(node, i, v, path.concat(i)));
    else Object.keys(node).forEach((k) => visit(node, k, node[k], path.concat(k)));
  };
  walk(root, []);
  return out;
}
function imgName(path, holder) {
  const id = slug(holder && holder.id);
  switch (path[0]) {
    case 'products': return 'product-' + (id || slug(holder.modelCode) || 'item');
    case 'categories': return 'category-' + (id || 'item');
    case 'banners': return 'banner-' + ((path[1] || 0) + 1);
    case 'storeInfo': return 'logo';
    default: return 'image';
  }
}

/* =====================================================================
   النشر: commit واحد يحتوي content.json + الصور الجديدة
   ===================================================================== */
async function commitToGitHub(progress, message) {
  const base = `/repos/${Cfg.owner}/${Cfg.repo}`;
  const br = encodeURI(Cfg.branch);
  for (let attempt = 0; attempt < 2; attempt++) {
    progress('جارٍ الاتصال بـ GitHub…');
    const ref = await gh(`${base}/git/ref/heads/${br}`);
    const headSha = ref.object.sha;
    const head = await gh(`${base}/git/commits/${headSha}`);
    const tree = await gh(`${base}/git/trees/${head.tree.sha}`);
    const entry = (tree.tree || []).find((t) => t.path === 'content.json');
    if (attempt === 0 && entry && S.fileSha && entry.sha !== S.fileSha && !S.conflictOk) throw new SoftError('ConflictError', 'conflict');

    const data = clone(S.data);
    const found = collectDataUrls(data);
    const total = new Set(found.map((f) => f.dataUrl)).size;
    const map = new Map(), items = [];
    const stamp = Date.now().toString(36);
    for (const f of found) {
      if (!map.has(f.dataUrl)) {
        progress(`جارٍ رفع الصور (${map.size + 1} من ${total})…`);
        const { mime, b64 } = parseDataUrl(f.dataUrl);
        const path = `images/${f.name}-${stamp}${map.size ? '-' + (map.size + 1) : ''}.${extFor(mime)}`;
        const blob = await gh(`${base}/git/blobs`, { method: 'POST', body: { content: b64, encoding: 'base64' } });
        items.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
        map.set(f.dataUrl, path);
      }
      f.holder[f.key] = map.get(f.dataUrl);
    }

    progress('جارٍ حفظ بيانات المتجر…');
    const json = JSON.stringify(data, null, 2) + '\n';
    const jb = await gh(`${base}/git/blobs`, { method: 'POST', body: { content: json, encoding: 'utf-8' } });
    items.push({ path: 'content.json', mode: '100644', type: 'blob', sha: jb.sha });
    const nt = await gh(`${base}/git/trees`, { method: 'POST', body: { base_tree: head.tree.sha, tree: items } });
    const commit = await gh(`${base}/git/commits`, { method: 'POST', body: { message, tree: nt.sha, parents: [headSha] } });
    progress('جارٍ اعتماد التعديلات…');
    try {
      await gh(`${base}/git/refs/heads/${br}`, { method: 'PATCH', body: { sha: commit.sha, force: false } });
      return { commit, data, map, fileSha: jb.sha };
    } catch (e) {
      if (attempt === 0 && (e.status === 422 || e.status === 409)) continue;
      throw e;
    }
  }
}

        <button class="btn btn-ghost" data-modal-cancel>إغلاق</button>

async function watchLive(expected) {
  if (!isHosted()) return;
  const run = ++S.liveRun;
  setLive('waiting');
  for (let k = 0; k < 40; k++) {
    await sleep(k < 6 ? 5000 : 10000);
    if (run !== S.liveRun) return;
    try {
      const r = await fetch('./content.json?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) {
        const j = normalize(await r.json());
        if (JSON.stringify(j) === expected) {
          setLive('live');
          toast('✓ التعديلات ظهرت الآن على الموقع', 'ok', 4000);
          setTimeout(() => { if (run === S.liveRun) setLive(''); }, 20000);
          return;
        }
      }
    } catch (e) {}
  }
  if (run === S.liveRun) setLive('slow');
}

/* =====================================================================
   ملخص التعديلات + فحص سلامة البيانات
   ===================================================================== */
function diffSummary() {
  const pub = S.pubObj || {}, cur = S.data, parts = [];
  let count = 0, add = 0, del = 0, ed = 0;
  const pm = new Map((pub.products || []).map((p) => [p.id, JSON.stringify(p)]));
  const cm = new Map(cur.products.map((p) => [p.id, JSON.stringify(p)]));
  cm.forEach((j, id) => { if (!pm.has(id)) add++; else if (pm.get(id) !== j) ed++; });
  pm.forEach((_, id) => { if (!cm.has(id)) del++; });
  if (ed) parts.push('تعديل ' + arCount(ed, 'منتج واحد', 'منتجين', 'منتجات', 'منتجاً'));
  if (add) parts.push('إضافة ' + arCount(add, 'منتج واحد', 'منتجين', 'منتجات', 'منتجاً'));
  if (del) parts.push('حذف ' + arCount(del, 'منتج واحد', 'منتجين', 'منتجات', 'منتجاً'));
  count += ed + add + del;
  if (!ed && !add && !del && JSON.stringify(pub.products || []) !== JSON.stringify(cur.products)) { parts.push('ترتيب المنتجات'); count++; }
  new Set(Object.keys(pub).concat(Object.keys(cur))).forEach((k) => {
    if (k === 'products') return;
    if (JSON.stringify(pub[k]) !== JSON.stringify(cur[k])) { parts.push('تعديل ' + (SECTION_NAMES[k] || k)); count++; }
  });
  return { parts, count, short: parts.join('، ') };
}

function healthIssues() {
  const d = S.data, out = [];
  const add = (level, msg, go) => out.push(Object.assign({ level, msg }, go || {}));
  const pname = (p) => esc(short(p.nameAr || p.nameEn || p.modelCode || p.id || 'منتج', 45));

  const ids = {};
  d.products.forEach((p, i) => {
    const id = String(p.id || '').trim();
    if (!id) add('err', `منتج بدون معرّف (id): ${pname(p)}`, { view: 'products', i });
    else (ids[id] = ids[id] || []).push(i);
  });
  Object.keys(ids).filter((k) => ids[k].length > 1).forEach((k) => add('err', `المعرّف <b dir="ltr">${esc(k)}</b> مكرر في ${ids[k].length} منتجات — صفحة المنتج ستفتح الجهاز الخطأ`, { view: 'products', i: ids[k][1] }));
  dupIds(d.brands).forEach((id) => {
    const names = d.brands.filter((b) => b.id === id).map((b) => esc(b.nameAr || b.nameEn || '—')).join('، ');
    add('err', `معرّف الماركة <b dir="ltr">${esc(id)}</b> مكرر بين: ${names} — اجعل لكل ماركة معرّفاً مختلفاً`, { view: 'brands' });
  });
  dupIds(d.categories).forEach((id) => add('err', `معرّف القسم <b dir="ltr">${esc(id)}</b> مكرر`, { view: 'categories' }));

  const noImg = d.products.filter((p) => !p.image).length;
  if (noImg) add('warn', `${arCount(noImg, 'منتج واحد', 'منتجان', 'منتجات', 'منتجاً')} بدون صورة — تظهر صورة فارغة في الموقع`, { view: 'products', status: 'noimg' });
  const brandSet = new Set(d.brands.map((b) => b.id));
  d.products.forEach((p, i) => {
    const c = catById(p.category);
    if (!c) add('warn', `القسم غير موجود — ${pname(p)}`, { view: 'products', i });
    else if (p.subcategory && !c.subcategories.some((s) => s.id === p.subcategory)) add('warn', `الفئة الفرعية غير موجودة — ${pname(p)}`, { view: 'products', i });
    if (p.brand && !brandSet.has(p.brand)) add('warn', `الماركة غير موجودة — ${pname(p)}`, { view: 'products', i });
    if (!(+p.price > 0)) add('warn', `بدون سعر — ${pname(p)}`, { view: 'products', i });
  });
  d.banners.forEach((b, i) => {
    if (i < 2 && !b.image) add('warn', `البانر ${i + 1} (${i ? 'الجانبي' : 'الرئيسي'}) بدون صورة`, { view: 'banners' });
    if (b.targetCategory && !catById(b.targetCategory)) add('warn', `البانر ${i + 1} مربوط بقسم غير موجود`, { view: 'banners' });
  });
  if (d.banners.length > 2) add('info', `يوجد ${d.banners.length} بانرات، لكن الموقع يعرض أول بانرين فقط`, { view: 'banners' });
  const catNoImg = d.categories.filter((c) => !c.image).length;
  if (catNoImg) add('info', `${arCount(catNoImg, 'قسم واحد', 'قسمان', 'أقسام', 'قسماً')} بدون صورة دائرية`, { view: 'categories' });
  if (!String(d.storeInfo.whatsappNumber || '').trim()) add('warn', 'رقم الواتساب فارغ — زر «اطلب عبر واتساب» لن يعمل', { view: 'store' });
  const order = { err: 0, warn: 1, info: 2 };
  return out.sort((a, b) => order[a.level] - order[b.level]);
}

function field(label, path, o = {}) {

  const attrs = `data-path="${path}"${o.dir ? ` dir="${o.dir}"` : ''}${o.placeholder ? ` placeholder="${esc(o.placeholder)}"` : ''}${o.ref ? ` data-ref="${o.ref}" data-orig="${esc(v == null ? '' : v)}"` : ''}`;
  const cls = 'in' + (o.mono ? ' mono' : '');
  let input;
  if (o.textarea) input = `<textarea class="${cls}" rows="${o.rows || 2}" ${attrs}>${esc(v == null ? '' : v)}</textarea>`;
  else if (o.kind === 'price') input = `<input class="${cls} num${o.strong ? ' strong' : ''}" inputmode="numeric" autocomplete="off" data-kind="price" ${attrs} value="${v ? fmt(v) : ''}">`;
  else if (o.kind === 'num') input = `<input class="${cls} num" inputmode="numeric" autocomplete="off" data-kind="num" ${attrs} value="${v == null ? '' : esc(v)}">`;

  return `<label class="fld${o.cls ? ' ' + o.cls : ''}">${label ? `<span class="fl">${label}</span>` : ''}${input}${o.hint ? `<span class="fh">${o.hint}</span>` : ''}</label>`;
}
function selectField(label, path, opts) {
  const v = getPath(S.data, path) == null ? '' : String(getPath(S.data, path));
  const seen = new Set(), list = [];
  opts.forEach((o) => { if (!seen.has(o[0])) { seen.add(o[0]); list.push(o); } });

  return `<label class="fld"><span class="fl">${label}</span><select class="in" data-path="${path}">${list.map(([val, t]) => `<option value="${esc(val)}"${val === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;
}
function sw(path, on, label, cls) {
  return `<label class="sw${cls ? ' ' + cls : ''}"><input type="checkbox" data-path="${path}" data-kind="bool"${on ? ' checked' : ''}><span class="sw-t"></span><span>${label}</span></label>`;

function filteredIdx() {

    if (S.fCat !== 'all' && p.category !== S.fCat) return;
    if (S.fBrand !== 'all' && p.brand !== S.fBrand) return;
    if (S.fStatus === 'in' && !p.inStock) return;
    if (S.fStatus === 'out' && p.inStock) return;
    if (S.fStatus === 'offer' && !isOffer(p)) return;
    if (S.fStatus === 'noimg' && p.image) return;

    out.push(i);

}

function buildNav() {
  $('#nav').innerHTML = NAV.map((n) => n ? `<a href="#/${n[0]}" data-nav="${n[0]}">${icon(n[1])}<span>${n[2]}</span>${n[0] === 'products' ? '<span class="nav-count" id="nav-pcount"></span>' : ''}</a>` : '<div class="sep"></div>').join('');

  $('#site-link').href = siteUrl();
}
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  S.view = VIEWS[h] ? h : 'dashboard';
  $$('[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === S.view));
  $('#page-title').textContent = VIEWS[S.view].t;
  $('#page-sub').textContent = VIEWS[S.view].s;
  document.body.classList.remove('side-open');
  closeDrawer(true);
  renderView();
  window.scrollTo(0, 0);
  if (S.pendingDrawer != null && S.view === 'products' && S.data) { const i = S.pendingDrawer; S.pendingDrawer = null; openDrawer(i); }
}
function go(view) {
  if (location.hash === '#/' + view) route(); else location.hash = '#/' + view;
}
function renderView() {
  const el = $('#view');
  if (!S.data) {
    el.innerHTML = S.loadError
      ? `<div class="card center-box"><div class="big-ic bad">${icon('alert')}</div><h3>تعذّر تحميل بيانات المتجر</h3><p>${esc(S.loadError.status ? ghErrorAr(S.loadError) : 'تأكد من الاتصال بالإنترنت ثم أعد المحاولة.')}</p><div class="row-btns center"><button type="button" class="btn btn-primary" data-act="reload">إعادة المحاولة</button><label class="btn btn-ghost">فتح ملف content.json من جهازي<input type="file" id="import-file" accept=".json,application/json" hidden></label></div></div>`
      : `<div class="center-box"><div class="spinner"></div><p class="muted">جارٍ تحميل بيانات المتجر…</p></div>`;
    return;
  }
  const fn = { dashboard: vDashboard, products: vProducts, categories: vCategories, brands: vBrands, banners: vBanners, branches: vBranches, faqs: vFaqs, store: vStore, connect: vConnect }[S.view];
  el.innerHTML = fn();
  if (S.view === 'products') renderProductList();
  const pc = $('#nav-pcount'); if (pc) pc.textContent = S.data.products.length;
  renderNotice();
}
function renderNotice() {
  const el = $('#notice');
  if (!S.draft) { el.innerHTML = ''; return; }
  const when = new Date(S.draft.at).toLocaleString('ar-IQ', { dateStyle: 'medium', timeStyle: 'short' });
  const stale = S.draft.base && S.fileSha && S.draft.base !== S.fileSha;
  el.innerHTML = `<div class="notice">${icon('alert')}<div><b>لديك تعديلات غير منشورة محفوظة على هذا الجهاز</b> (${esc(when)}).${stale ? ' انتبه: الموقع تغيّر بعد حفظها، واسترجاعها سيستبدل التغييرات الأحدث.' : ''}</div><div class="row-btns"><button type="button" class="btn btn-primary btn-sm" data-act="restoreDraft">استرجاعها</button><button type="button" class="btn btn-ghost btn-sm" data-act="discardDraft">تجاهلها</button></div></div>`;
}
function openDrawer(i) {
  if (!S.data.products[i]) return;
  S.drawerIndex = i;

  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden', 'false');
  document.body.classList.add('drawer-open', 'lock');

function closeDrawer(silent) {
  if (S.drawerIndex < 0) return;
  S.drawerIndex = -1;
  $('#drawer').classList.remove('open');
  $('#drawer').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('drawer-open', 'lock');

}
function refreshAfterImage() {
  if (S.drawerIndex >= 0) renderDrawer();

function scrollToLast() {

function setLive(st) {

function updateDirtyUI() {

function saveDraft() {
  if (!S.data) return;
  if (!isDirty()) { store.del(KEYS.draft); return; }

  if (!ok && !S.warnedQuota) { S.warnedQuota = true; toast('مساحة الحفظ المؤقت امتلأت بسبب الصور — انشر التعديلات الآن حتى لا تضيع', 'err', 7000); }
}
let changeT = null;
function changed() {
  if (S.draft) { S.draft = null; renderNotice(); }
  clearTimeout(changeT);
  changeT = setTimeout(() => { updateDirtyUI(); saveDraft(); updateModMarks(); }, 200);

/* ---------------- Modal + toast ---------------- */
let modalResolve = null, toastT = null;
function openModal(html, o = {}) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-ov" data-modal-bg><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  root.classList.add('open');
  S.modalLocked = !!o.locked;
}
function closeModal(result) {
  const root = $('#modal-root');
  root.classList.remove('open'); root.innerHTML = '';
  S.modalLocked = false;
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(!!result); }
}
function confirmDialog({ title, body, ok = 'تأكيد', cancel = 'إلغاء', danger = false, okClass }) {
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(false); }
  return new Promise((res) => {
    openModal(`<h3>${title}</h3><div>${body}</div><div class="modal-foot"><button type="button" class="btn ${okClass || (danger ? 'btn-danger' : 'btn-primary')}" data-modal-ok>${ok}</button><button type="button" class="btn btn-ghost" data-modal-cancel>${cancel}</button></div>`);
    modalResolve = res;
  });
}
function notConnectedModal() {
  openModal(`<h3>${icon('key')} اربط اللوحة بموقعك أولاً</h3>
    <p>هذه خطوة لمرة واحدة فقط (دقيقتين). بعدها زر «نشر» يحدّث الموقع مباشرة، وتفتح اللوحة من رابطك الخاص بدون كلمة سر.</p>
    <p class="muted">تعديلاتك محفوظة على هذا الجهاز ولن تضيع.</p>
    <div class="modal-foot"><a class="btn btn-primary" href="#/connect" data-modal-cancel>ابدأ الربط الآن</a><button type="button" class="btn btn-ghost" data-act="downloadJson">تنزيل content.json يدوياً</button><button type="button" class="btn btn-ghost" data-modal-cancel>لاحقاً</button></div>`);
}
function toast(msg, type = 'ok', ms = 3200) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.className = type; }, ms);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); return ok;
  }
}

   ===================================================================== */
function applyField(el) {
  const path = el.dataset.path, kind = el.dataset.kind || 'text';
  let v;
  if (kind === 'bool') v = el.checked;
  else if (kind === 'price') { const dg = toLatin(el.value).replace(/[^\d]/g, ''); v = dg ? Number(dg) : 0; }
  else if (kind === 'num') { const n = parseFloat(toLatin(el.value).replace(/[^\d.]/g, '')); v = isNaN(n) ? 0 : n; }
  else if (kind === 'digits') v = toLatin(el.value).replace(/\D/g, '');
  else if (kind === 'url') v = el.value.trim();
  else v = el.value;
  setPath(S.data, path, v);
  afterChange(path, v);
  changed();
}
function syncIdInput(path, id) {
  const el = document.querySelector(`[data-path="${path}"]`);
  if (el) { el.value = id; if (el.dataset.ref) el.dataset.orig = id; }
}
function afterChange(path, v) {
  let m;
  if ((m = path.match(/^products\.(\d+)\.(price|oldPrice|isOffer)$/))) {
    const p = S.data.products[+m[1]];
    $$(`[data-disc="${m[1]}"]`).forEach((el) => { el.innerHTML = discHtml(p); });
  }
  if ((m = path.match(/^products\.(\d+)\.nameAr$/)) && S.drawerIndex === +m[1]) {
    const h = $('#dr-title'); if (h) h.textContent = v || 'منتج جديد';
  }
  if ((m = path.match(/^products\.(\d+)\.category$/))) {
    const p = S.data.products[+m[1]], c = catById(v);
    if (c && !c.subcategories.some((s) => s.id === p.subcategory)) p.subcategory = c.subcategories[0] ? c.subcategories[0].id : '';
    const w = $('#sub-wrap'); if (w) w.innerHTML = subSelect(+m[1]);
  }
  if ((m = path.match(/^products\.(\d+)\.(modelCode|brand)$/))) {
    const p = S.data.products[+m[1]];
    if (autoIds.has(p) && p.modelCode) { p.id = uniqueId(slug(p.brand + '-' + p.modelCode), S.data.products, p); syncIdInput(`products.${m[1]}.id`, p.id); }
  }
  if ((m = path.match(/^(.+)\.id$/))) { const o = getPath(S.data, m[1]); if (o) autoIds.delete(o); }
  if ((m = path.match(/^((?:categories|brands)\.\d+(?:\.subcategories\.\d+)?)\.nameEn$/))) {
    const o = getPath(S.data, m[1]);
    if (o && autoIds.has(o)) {
      const list = getPath(S.data, m[1].replace(/\.\d+$/, ''));
      o.id = uniqueId(slug(v) || 'item', list, o);
      syncIdInput(m[1] + '.id', o.id);
    }
  }
  if ((m = path.match(/^banners\.(\d+)\.(titleAr|badgeAr)$/))) {
    const t = $(`[data-bprev="${m[1]}"] .${m[2] === 'titleAr' ? 'bt' : 'bb'}`); if (t) t.textContent = v;
  }
}
/* عند تغيير معرّف قسم/ماركة/فئة: نحدّث المنتجات المرتبطة به تلقائياً */
function handleIdRename(el) {
  const path = el.dataset.path, ref = el.dataset.ref;
  const oldId = el.dataset.orig || '', newId = el.value.trim();
  setPath(S.data, path, newId); el.value = newId;
  if (oldId === newId) return;
  el.dataset.orig = newId;
  let n = 0;
  if (ref === 'category') {
    if (S.data.categories.filter((c) => c.id === newId).length > 1) toast('هذا المعرّف مستخدم لقسم آخر — اختر معرّفاً مختلفاً', 'err', 5000);
    if (oldId && !S.data.categories.some((c) => c.id === oldId)) {
      S.data.products.forEach((p) => { if (p.category === oldId) { p.category = newId; n++; } });
      S.data.banners.forEach((b) => { if (b.targetCategory === oldId) b.targetCategory = newId; });
    }
  } else if (ref === 'brand') {
    if (S.data.brands.filter((b) => b.id === newId).length > 1) toast('هذا المعرّف مستخدم لماركة أخرى — اختر معرّفاً مختلفاً', 'err', 5000);
    if (oldId && !S.data.brands.some((b) => b.id === oldId)) S.data.products.forEach((p) => { if (p.brand === oldId) { p.brand = newId; n++; } });
  } else if (ref === 'subcategory') {
    const c = S.data.categories[+path.split('.')[1]];
    if (c && oldId && !c.subcategories.some((s) => s.id === oldId)) S.data.products.forEach((p) => { if (p.category === c.id && p.subcategory === oldId) { p.subcategory = newId; n++; } });
  }
  if (n) toast(`تم تحديث ${arCount(n, 'منتج واحد', 'منتجين', 'منتجات', 'منتجاً')} ليتبع المعرّف الجديد`);
  changed();
  if (ref !== 'subcategory') renderView();
}
async function handleUpload(input) {
  const file = input.files && input.files[0];
  const path = input.dataset.upload, kind = input.dataset.imgKind;
  input.value = '';
  if (!file) return;
  toast('جارٍ تجهيز الصورة…', 'ok', 1500);
  try {
    const url = await processImage(file, kind);
    setPath(S.data, path, url);
    changed();
    refreshAfterImage();
    toast('✓ تم وضع الصورة — ستُرفع للموقع عند الضغط على «نشر التعديلات»');
  } catch (e) {
    toast(e && e.message === 'big' ? 'الصورة كبيرة جداً (أكثر من 20MB)' : 'تعذّر قراءة الصورة — جرّب صورة JPG أو PNG', 'err', 5000);
  }
}
async function importJson(el) {
  const f = el.files && el.files[0]; el.value = '';
  if (!f) return;
  const obj = safeJson(await f.text());
  if (!obj) { toast('الملف ليس JSON صالحاً', 'err'); return; }
  if (!Array.isArray(obj.products)) { toast('هذا الملف لا يحتوي على منتجات (products)', 'err'); return; }
  if (S.data) {
    const ok = await confirmDialog({ title: 'استيراد ملف بيانات', body: `<p>سيتم استبدال كل البيانات الحالية في اللوحة بمحتوى الملف (${obj.products.length} منتج). الموقع لن يتغير إلا بعد النشر.</p>`, ok: 'استيراد' });

  } else { setPublished('{}'); S.loadError = null; }

  closeDrawer(true);
  changed(); renderView();

/* =====================================================================
   الأحداث
   ===================================================================== */
function bindEvents() {
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('[data-modal-ok]')) { closeModal(true); return; }
    if (t.closest('[data-modal-cancel]')) { closeModal(false); return; }
    if (t.hasAttribute && t.hasAttribute('data-modal-bg')) { if (!S.modalLocked) closeModal(false); return; }
    const a = t.closest('[data-act]');
    if (!a) return;
    const fn = Actions[a.dataset.act];
    if (!fn) return;
    if (a.tagName !== 'A') e.preventDefault();
    fn(a, e);
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'q') { S.q = el.value; renderProductList(); return; }
    if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'file') return;
    if (el.dataset && el.dataset.path) applyField(el);
  });
  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.matches('input[type=file][data-upload]')) { handleUpload(el); return; }
    if (el.id === 'import-file') { importJson(el); return; }
    if (el.dataset.filter) { S[el.dataset.filter] = el.value; renderProductList(); return; }
    if (!el.dataset.path) return;
    if (el.tagName === 'SELECT' || el.type === 'checkbox') applyField(el);
    if (el.dataset.ref) handleIdRename(el);
    const kind = el.dataset.kind;
    if (kind === 'price') { const n = getPath(S.data, el.dataset.path); el.value = n ? fmt(n) : ''; }
    if (kind === 'digits') el.value = getPath(S.data, el.dataset.path) || '';
    if (kind === 'url') {
      const box = el.closest('.imgfld'), prev = box && $('.imgprev', box);
      if (prev) prev.innerHTML = thumb(getPath(S.data, el.dataset.path)); else refreshAfterImage();
      if (S.view === 'products' && S.drawerIndex >= 0) renderProductList();
    }
  });
  // صورة مفقودة على الموقع؟ نجرب رابط GitHub المباشر
  document.addEventListener('error', (e) => {
    const t = e.target;
    if (!t || t.tagName !== 'IMG') return;
    if (t.dataset.fallback) { const fb = t.dataset.fallback; t.removeAttribute('data-fallback'); t.src = fb; }
    else t.classList.add('broken');
  }, true);
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyS') { e.preventDefault(); publish(); return; }
    if (e.key === 'Escape') {
      if ($('#modal-root').classList.contains('open')) { if (!S.modalLocked) closeModal(false); }
      else if (S.drawerIndex >= 0) closeDrawer();
      else document.body.classList.remove('side-open');
    }
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('beforeunload', (e) => {
    if (isDirty()) { saveDraft(); e.preventDefault(); e.returnValue = ''; }
  });
}

/* الرابط الخاص: admin.html#key=المفتاح */
function readKeyFromHash() {
  const m = location.hash.match(/(?:^#|&)(?:key|token)=([^&]+)/);
  if (!m) return;
  let tok = '';
  try { tok = decodeURIComponent(m[1]).trim(); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
  if (tok) { Token = tok; store.set(KEYS.token, tok); S.conn = 'checking'; S.fromLink = true; }
}

async function boot() {
  readKeyFromHash();
  buildNav();
  bindEvents();
  updateConnPill();
  route();
  try { await loadLive(); S.loadError = null; } catch (e) { S.loadError = e; }
  if (S.data) {
    const dr = safeJson(store.get(KEYS.draft));
    if (dr && dr.data && Array.isArray(dr.data.products)) {
      normalize(dr.data);
      if (JSON.stringify(dr.data) !== S.published) S.draft = dr; else store.del(KEYS.draft);
    }
  }
  route();
  updateDirtyUI();
  loadCommits();
  if (Token) {
    const r = await testToken(Token, S.fromLink);
    S.conn = r.ok ? 'ok' : 'bad'; S.connMsg = r.msg || '';
    updateConnPill();
    if (S.view === 'dashboard' || S.view === 'connect') renderView();
    if (S.fromLink) toast(r.ok ? '✓ تم فتح اللوحة من رابطك الخاص — النشر جاهز' : 'الرابط الخاص يحتوي مفتاحاً لا يعمل', r.ok ? 'ok' : 'err', 4500);
  }
}
boot();
</script>
</body>
</html>
