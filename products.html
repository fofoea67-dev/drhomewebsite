<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="products">
<div id="dh-top"></div>
<main>
  <div class="wrap">
    <nav class="crumbs" aria-label="مسار التصفح"><a href="index.html">الرئيسية</a><i data-i="chevL"></i><a href="products.html">المنتجات</a><i data-i="chevL"></i><b>الثلاجات</b></nav>
    <div class="cat-head">
      <div><p class="eyebrow">Refrigerators</p><h1 class="h1">الثلاجات</h1><p class="muted">بأربعة أبواب، وجنباً إلى جنب، وبابين. كلها بضاغط إنفرتر هادئ وموفّر للكهرباء.</p></div>
      <div class="tabs" id="chips" role="group" aria-label="نوع الثلاجة"></div>
    </div>
    <div class="cat-banner"><i data-i="shield"></i><span><b>ضمان 10 سنوات</b> على ضاغط الإنفرتر في كل الثلاجات، مع توصيل وتركيب مجاني.</span></div>
    <div class="shop">
      <aside class="filters" id="filters" aria-label="تصفية النتائج"></aside>
      <div>
        <div class="toolbar">
          <p id="plpCount" aria-live="polite"></p>
          <div class="btn-row">
            <button class="btn btn-outline btn-sm filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filters"><i data-i="sliders"></i>تصفية</button>
            <div class="sel"><label class="sr-only" for="sort">ترتيب حسب</label>
              <select id="sort"><option value="best">الأكثر مبيعاً</option><option value="new">الأحدث</option><option value="low">السعر: من الأقل</option><option value="high">السعر: من الأعلى</option></select><i data-i="chevD"></i></div>
          </div>
        </div>
        <div class="grid-3" id="plp"></div>
        <div class="more"><span>عرضت كل الثلاجات المتوفرة حالياً</span><div class="more-bar"><i id="moreBar"></i></div></div>
      </div>
    </div>
  </div>
  <section class="sec-sm sec-soft" aria-label="لماذا دكتور هوم">
    <div class="wrap"><div class="feats" data-feats></div></div>
